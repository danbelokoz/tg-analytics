<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Админка — мониторинг сбора</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="fonts/manrope.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f5f7;--card:#fff;--ink:#18181f;--muted:#6b6f7e;--line:#ececf0;--accent:#1573c4;
  --ok:#137a3a;--okbg:#e7f7ec;--err:#c0392b;--errbg:#fdecea;--warnbg:#fff4e0;--warn:#a8710a}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:26px 22px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
.brand i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#2AABEE,#6366f1);display:inline-flex;
  align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:12px}
.brand{text-decoration:none;color:inherit}
.navlink{font-weight:700;font-size:13.5px;color:#6b6f7e;text-decoration:none;transition:.13s}
.navlink:hover{color:var(--ink)}
.who{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.who b{color:var(--ink)}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:800 12.5px 'Manrope';
  color:var(--ink);cursor:pointer;transition:.13s}
.btn:hover{border-color:#d7dae2}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.hint{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative}
.scard .top{display:flex;align-items:center;gap:10px}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.na{background:#c7cad2}
.scard h3{font-size:15px;font-weight:800}
.badge{margin-left:auto;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:8px}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.na{background:#eef0f3;color:var(--muted)}
.when{margin-top:12px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.when small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px}
.stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.stat .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.err-line{margin-top:12px;font-size:12.5px;font-weight:600;background:var(--errbg);color:var(--err);
  padding:8px 11px;border-radius:9px;overflow-wrap:anywhere}
.warn-line{background:var(--warnbg);color:var(--warn)}
details{margin-top:10px}
details summary{font-size:12.5px;font-weight:700;color:var(--accent);cursor:pointer;list-style:none}
details ul{margin:8px 0 0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.7;max-height:180px;overflow:auto}
.sec{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#9095a5;margin:28px 0 12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line)}
th{font-weight:800;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
td .pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.err{background:var(--errbg);color:var(--err)}
.state{padding:50px 20px;text-align:center;color:var(--muted);font-weight:600}
.mono{font-variant-numeric:tabular-nums}
/* Свежесть источников: карточка «когда обновлялись» + мини-график + расписание */
.srccards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.srccards{grid-template-columns:1fr}}
.fresh{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.fresh .top{display:flex;align-items:center;gap:9px}
.fresh h3{font-size:14.5px;font-weight:800}
.fresh .badge{margin-left:auto}
.fresh .big{margin-top:12px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.fresh .big small{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.spark{margin-top:12px;display:block;width:100%;height:38px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .area{fill:var(--accent);opacity:.09;stroke:none}
.spark .dotlast{fill:var(--accent)}
.sched{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;line-height:1.7}
.sched .row{display:flex;justify-content:space-between;gap:8px}
.sched .k{color:var(--muted);font-weight:600}
.sched .val{font-weight:800}
.sched .val.due{color:var(--warn)}
.srcnote{margin-top:9px;font-size:11px;color:#9095a5;font-weight:600;line-height:1.45}
/* Ошибки/предупреждения: панель проблем последних прогонов (зелёная, если чисто) */
.okbanner{display:flex;align-items:center;gap:12px;background:var(--okbg);border:1px solid #cdeed6;
  border-radius:14px;padding:15px 18px;font-size:14px;font-weight:600;color:#0f5f2e}
.errsummary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pillbig{font-size:13px;font-weight:800;padding:6px 12px;border-radius:10px}
.pillbig.err{background:var(--errbg);color:var(--err)}
.pillbig.warn{background:var(--warnbg);color:var(--warn)}
.errsub{color:var(--muted);font-size:12.5px;font-weight:700}
.errlist{display:flex;flex-direction:column;gap:10px}
.erritem{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 15px;background:var(--card)}
.erritem.fatal{border-left-color:var(--err)}
.erritem.warn{border-left-color:var(--warn)}
.ehead{display:flex;align-items:center;gap:10px}
.ehead .badge{margin-left:0}
.esrc{font-weight:800;font-size:13.5px}
.etime{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.emsg{margin-top:8px;font-size:13px;font-weight:600;color:#31323c;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><i>◈</i> Telemetria</a>
    <a class="navlink" href="/">Лента вакансий</a>
    <span class="who" id="who"></span>
    <button class="btn" id="refresh">Обновить</button>
    <button class="btn" id="logout">Выйти</button>
  </header>

  <div id="root"><div class="state">Загрузка…</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const WF = {
  tg:    { label: "TG-лента", note: "каждые 30 мин", unit: "вакансий" },
  sites: { label: "Сайты компаний", note: "2×/сутки", unit: "вакансий" },
};

function ago(iso) {
  if (!iso) return "никогда";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "только что";
  const m = Math.floor(s / 60); if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m / 60); if (h < 24) return `${h} ч назад`;
  const d = Math.floor(h / 24); return `${d} дн назад`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, few, many) => { const m = n % 100, d = n % 10; return (m >= 11 && m <= 14) ? many : d === 1 ? one : (d >= 2 && d <= 4) ? few : many; };

// Панель ошибок: проблемные прогоны из истории. Фатальные (ok:false) — красным,
// частичные падения источников (failed>0) — жёлтым. Если чисто — зелёный баннер.
function errorPanel(runs) {
  const problems = runs.filter((r) => !r.ok || (r.failed | 0) > 0 || r.error);
  if (!problems.length) {
    return `<div class="okbanner"><span class="dot ok"></span>
      <div><b>Ошибок нет.</b> Все последние прогоны (${runs.length}) прошли чисто.</div></div>`;
  }
  const items = problems.slice(0, 25).map((r) => {
    const meta = WF[r.workflow] || { label: r.workflow };
    const fatal = !r.ok;
    const failedList = (r.meta && r.meta.failed) || [];
    const emptyList = (r.meta && r.meta.empty) || [];
    const msg = r.error || (r.failed ? `Упало источников: ${r.failed}` : "");
    return `<div class="erritem ${fatal ? "fatal" : "warn"}">
      <div class="ehead">
        <span class="badge ${fatal ? "err" : ""}"${fatal ? "" : ' style="background:var(--warnbg);color:var(--warn)"'}>${fatal ? "ошибка" : "предупреждение"}</span>
        <span class="esrc">${esc(meta.label)}</span>
        <span class="etime" title="${esc(r.finished_at)}">${ago(r.finished_at)} · ${new Date(r.finished_at).toLocaleString("ru-RU")}</span>
      </div>
      ${msg ? `<div class="emsg">${esc(msg)}</div>` : ""}
      ${failedList.length ? `<details><summary>Упавшие источники (${failedList.length})</summary><ul>${failedList.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
      ${emptyList.length ? `<details><summary>Пустые, 0 вакансий (${emptyList.length})</summary><ul>${emptyList.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    </div>`;
  }).join("");
  const fatalN = problems.filter((r) => !r.ok).length;
  const warnN = problems.length - fatalN;
  return `<div class="errsummary">
      ${fatalN ? `<span class="pillbig err">${fatalN} ${plural(fatalN, "ошибка", "ошибки", "ошибок")}</span>` : ""}
      ${warnN ? `<span class="pillbig warn">${warnN} ${plural(warnN, "предупреждение", "предупреждения", "предупреждений")}</span>` : ""}
      <span class="errsub">за последние ${runs.length} ${plural(runs.length, "прогон", "прогона", "прогонов")}</span>
    </div>
    <div class="errlist">${items}</div>`;
}

function statusCard(run, key) {
  const meta = WF[key] || { label: key, note: "", unit: "записей" };
  if (!run) return `<div class="scard"><div class="top"><span class="dot na"></span>
      <h3>${meta.label}</h3><span class="badge na">нет данных</span></div>
      <div class="when">—<small>прогонов ещё не было</small></div></div>`;
  const ok = run.ok;
  const failedList = (run.meta && run.meta.failed) || [];
  const emptyList = (run.meta && run.meta.empty) || [];
  const drop = !ok && run.error;
  return `<div class="scard">
    <div class="top"><span class="dot ${ok ? "ok" : "err"}"></span>
      <h3>${meta.label} <span style="color:var(--muted);font-weight:600;font-size:12px">· ${meta.note}</span></h3>
      <span class="badge ${ok ? "ok" : "err"}">${ok ? "успешно" : "проблема"}</span></div>
    <div class="when">${ago(run.finished_at)}<small title="${esc(run.finished_at)}">${new Date(run.finished_at).toLocaleString("ru-RU")}</small></div>
    <div class="stats">
      <div class="stat"><div class="v mono">${run.total ?? "—"}</div><div class="k">${meta.unit}${run.prev_total != null ? ` (было ${run.prev_total})` : ""}</div></div>
      <div class="stat"><div class="v mono">${run.failed || 0}</div><div class="k">упало источников</div></div>
    </div>
    ${run.error ? `<div class="err-line ${drop ? "warn-line" : ""}">${esc(run.error)}</div>` : ""}
    ${failedList.length ? `<details><summary>Упавшие источники (${failedList.length})</summary><ul>${failedList.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    ${emptyList.length ? `<details><summary>Пустые (0 вакансий): ${emptyList.length}</summary><ul>${emptyList.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
  </div>`;
}

function historyRow(r) {
  const meta = WF[r.workflow] || { label: r.workflow };
  return `<tr>
    <td>${new Date(r.finished_at).toLocaleString("ru-RU")}</td>
    <td>${esc(meta.label)}</td>
    <td><span class="pill ${r.ok ? "ok" : "err"}">${r.ok ? "ok" : "fail"}</span></td>
    <td class="mono">${r.total ?? "—"}</td>
    <td class="mono">${r.failed || 0}</td>
    <td style="color:var(--muted)">${esc(r.error || "")}</td>
  </tr>`;
}

// ── Свежесть источников ленты (когда обновлялись + когда должны) ─────────────
// Три фильтра ленты питаются двумя прогонами: Telegram — из «tg»; Global и
// Ru-global — оба из «sites» (career-сайты делятся на Global/Ru-global на фронте
// по RU-корням уже ПОСЛЕ сбора, поэтому обновляются одним прогоном).
const SOURCES = [
  { key: "Telegram", wf: "tg", label: "Telegram-чаты", kind: "every", everyMin: 30,
    schedText: "каждые 30 минут", note: "Посты из Telegram-каналов о работе." },
  { key: "Global", wf: "sites", label: "Global", kind: "cron", cronUTC: [5, 17],
    schedText: "2×/сутки · ~08:00 и ~20:00 МСК", note: "Международные career-сайты. Собирается одним прогоном с Ru-global." },
  { key: "Ru-global", wf: "sites", label: "Ru-global", kind: "cron", cronUTC: [5, 17],
    schedText: "2×/сутки · ~08:00 и ~20:00 МСК", note: "Компании с RU-корнями. Собирается одним прогоном с Global." },
];

// Ближайшее ожидаемое обновление: интервал — последний прогон + интервал;
// крон (часы UTC) — ближайший час из списка после «сейчас».
function nextUpdate(src, lastIso) {
  if (src.kind === "every") {
    const base = lastIso ? new Date(lastIso).getTime() : Date.now();
    return new Date(base + src.everyMin * 60000);
  }
  const now = Date.now(), d = new Date();
  for (let add = 0; add < 3; add++)
    for (const h of src.cronUTC) {
      const cand = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + add, h, 0, 0));
      if (cand.getTime() > now) return cand;
    }
  return null;
}
const fmtDT = (d) => d ? d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
function inLabel(d) {
  if (!d) return "—";
  const s = (d.getTime() - Date.now()) / 1000;
  if (s <= 0) return "ожидается сейчас";
  const m = Math.round(s / 60); if (m < 60) return `через ${m} мин`;
  const h = Math.round(m / 60); if (h < 48) return `через ${h} ч`;
  return `через ${Math.round(h / 24)} дн`;
}

// Мини-график «собрано за последние прогоны» (значения oldest→newest).
function sparkline(vals) {
  if (!vals.length) return `<div class="srcnote">графика нет — прогонов ещё не было</div>`;
  const w = 180, h = 38, pad = 4;
  const min = Math.min(...vals), max = Math.max(...vals), range = (max - min) || 1;
  const X = (i) => pad + (vals.length < 2 ? (w - 2 * pad) : (i / (vals.length - 1)) * (w - 2 * pad));
  const Y = (v) => h - pad - ((v - min) / range) * (h - 2 * pad);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area = `${X(0).toFixed(1)},${h - pad} ${pts} ${X(vals.length - 1).toFixed(1)},${h - pad}`;
  const lx = X(vals.length - 1).toFixed(1), ly = Y(vals[vals.length - 1]).toFixed(1);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon class="area" points="${area}"/><polyline points="${pts}"/>
    <circle class="dotlast" cx="${lx}" cy="${ly}" r="2.6"/></svg>`;
}

// Карточка источника: свежесть + мини-график собранного + расписание/следующее.
function freshCard(src, run, wfRuns) {
  const last = run && run.finished_at;
  const staleMs = src.kind === "every" ? src.everyMin * 60000 * 2 : 15 * 3600 * 1000;
  const fresh = last ? (Date.now() - new Date(last).getTime()) < staleMs : false;
  const next = nextUpdate(src, last);
  const due = next && next.getTime() <= Date.now();
  const state = last ? (fresh ? "ok" : "err") : "na";
  const stateText = last ? (fresh ? "актуально" : "устарело") : "нет данных";
  const series = wfRuns.slice().reverse().map((r) => r.total).filter((v) => v != null).slice(-16);
  return `<div class="fresh">
    <div class="top"><span class="dot ${state}"></span><h3>${esc(src.label)}</h3>
      <span class="badge ${state}">${stateText}</span></div>
    <div class="big">${last ? ago(last) : "—"}<small>${last ? new Date(last).toLocaleString("ru-RU") : "обновлений ещё не было"}</small></div>
    ${sparkline(series)}
    <div class="sched">
      <div class="row"><span class="k">Обновляется</span><span class="val">${esc(src.schedText)}</span></div>
      <div class="row"><span class="k">Следующее</span><span class="val ${due ? "due" : ""}">${inLabel(next)}</span></div>
      <div class="row"><span class="k">Ориентир</span><span class="val">${fmtDT(next)}</span></div>
    </div>
    <div class="srcnote">${esc(src.note)}</div>
  </div>`;
}

// fetch JSON с таймаутом — чтобы страница НИКОГДА не висла на «Загрузка…»
// (медленный/уснувший Supabase, зависший запрос): по таймауту вернём null.
async function fetchJSON(url, ms = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    return r.ok ? await r.json() : null;
  } catch {
    return null;
  } finally {
    clearTimeout(t);
  }
}

async function load() {
  try {
    // 1) кто я
    const me = await fetchJSON("/api/me");
    if (!me) { location.href = "/login"; return; }
    $("who").innerHTML = `<b>${esc(me.email)}</b> · ${esc(me.role)}`;
    if (me.role !== "admin") {
      $("root").innerHTML = `<div class="state">Доступ к мониторингу только у администраторов.<br>Ваша роль: ${esc(me.role)}.</div>`;
      return;
    }
    // 2) статус
    const st = await fetchJSON("/api/status");
    if (!st) {
      $("root").innerHTML = `<div class="state">Не удалось загрузить статус.<br>
        Проверьте, что в Supabase создана таблица <b>pipeline_runs</b> (schema_admin.sql).</div>`;
      return;
    }
    const latest = Array.isArray(st.latest) ? st.latest : [];
    const runs = Array.isArray(st.history) ? st.history : [];
    const byWf = {};
    for (const run of latest) byWf[run.workflow] = run;
    const runsBy = (wf) => runs.filter((r) => r.workflow === wf);
    const srcCards = SOURCES.map((s) => freshCard(s, byWf[s.wf], runsBy(s.wf))).join("");
    const cards = ["tg", "sites"].map((k) => statusCard(byWf[k], k)).join("");
    const history = runs.slice(0, 40).map(historyRow).join("");

    $("root").innerHTML = `
      <h1>Мониторинг сбора</h1>
      <div class="hint">Ошибки прогонов, свежесть источников и история сбора.</div>

      <div class="sec">Ошибки и предупреждения</div>
      ${errorPanel(runs)}

      <div class="sec">Свежесть источников</div>
      <div class="srccards">${srcCards}</div>

      <div class="sec">Прогоны пайплайна</div>
      <div class="cards">${cards}</div>

      <div class="sec">История прогонов</div>
      ${runs.length
        ? `<table><thead><tr><th>Время</th><th>Источник</th><th>Статус</th><th>Собрано</th><th>Упало</th><th>Заметка</th></tr></thead><tbody>${history}</tbody></table>`
        : `<div class="state">Прогонов ещё не было — появятся после ближайшего запуска скрейпера.<br>
           Запустить вручную: GitHub → Actions → «Jobs — TG feed» → Run workflow.</div>`}`;
  } catch (e) {
    // Любая ошибка рендера больше не оставляет «Загрузку» навсегда — показываем причину.
    $("root").innerHTML = `<div class="state">Ошибка загрузки: ${esc(e && e.message || e)}</div>`;
  }
}

$("refresh").onclick = load;
$("logout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/login"; };
load();
setInterval(load, 60000); // автообновление раз в минуту
</script>
